name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Keep in sync with UV_VERSION in deploy/ubuntu/install.sh: the lockfile
          # is generated with the pinned uv, and newer uv releases may require a
          # lockfile format upgrade that `--locked` refuses.
          version: "0.11.32"
      - run: uv sync --locked --all-groups
      - name: Validate deployment shell scripts
        run: find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate rendered systemd units
        run: bash deploy/systemd/verify-templates.sh
      - run: uv run ruff check app tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
